<style>
  body {
    background: #121213;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }
  h1 {
    margin-bottom: 1rem;
  }
  .board {
    display: grid;
    grid-template-rows: repeat(6, 60px);
    gap: 5px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(5, 60px);
    gap: 5px;
  }
  .cell {
    width: 60px;
    height: 60px;
    background: #3a3a3c;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.8rem;
    font-weight: bold;
    text-transform: uppercase;
    border-radius: 5px;
    perspective: 1000px;
  }
  .cell.flip {
    animation: flip 0.5s forwards;
  }
  @keyframes flip {
    0% { transform: rotateX(0deg); }
    50% { transform: rotateX(90deg); background: #3a3a3c; }
    100% { transform: rotateX(0deg); }
  }
  .cell.correct { background: #538d4e; }
  .cell.present { background: #b59f3b; }
  .cell.absent { background: #3a3a3c; opacity: 0.7; }
  .keyboard {
    margin-top: 1rem;
    display: grid;
    grid-template-columns: repeat(10, 40px);
    gap: 5px;
    justify-content: center;
  }
  .key {
    padding: 0.5rem;
    background: #818384;
    border-radius: 4px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    font-weight: bold;
  }
  .key.wide { grid-column: span 2; }
  .key.correct { background: #538d4e; }
  .key.present { background: #b59f3b; }
  .key.absent { background: #3a3a3c; opacity: 0.7; }
  #message {
    margin-top: 1rem;
    height: 1.5rem;
  }
  
  /* Credits button */
#credits-btn {
  position: fixed;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  opacity: 0.6;
  cursor: pointer;
  user-select: none;
}

#credits-btn:hover {
  opacity: 1;
}

/* Overlay */
#credits-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

/* Popup */
#credits-popup {
  background: #111;
  border: 1px solid #333;
  padding: 20px 30px;
  text-align: center;
  border-radius: 8px;
}

#credits-popup h2 {
  margin-top: 0;
}

#credits-popup a {
  color: #6aaa64;
  text-decoration: none;
}

#credits-popup a:hover {
  text-decoration: underline;
}

/* End game overlay */
#end-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

#end-popup {
  background: #111;
  border: 1px solid #333;
  padding: 24px 32px;
  border-radius: 10px;
  text-align: center;
}

#end-popup button {
  margin-top: 15px;
  padding: 8px 18px;
  font-size: 16px;
  cursor: pointer;
  background: #6aaa64;
  border: none;
  border-radius: 6px;
  color: #fff;
}

#end-popup button:hover {
  filter: brightness(1.1);
}

</style>

    const row = document.createElement("div");
    row.className = "row";
    for (let j = 0; j < maxCols; j++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      row.appendChild(cell);
    }
    board.appendChild(row);
  }

  // create keyboard
  const keys = "QWERTYUIOPASDFGHJKLZXCVBNM".split("");
  keys.forEach(k => {
    const keyBtn = document.createElement("div");
    keyBtn.textContent = k;
    keyBtn.className = "key";
    keyBtn.addEventListener("click", () => handleKey(k));
    keyboardEl.appendChild(keyBtn);
  });

  const enterKey = document.createElement("div");
  enterKey.textContent = "ENTER";
  enterKey.className = "key wide";
  enterKey.addEventListener("click", () => handleKey("ENTER"));
  keyboardEl.appendChild(enterKey);

  const backKey = document.createElement("div");
  backKey.textContent = "⌫";
  backKey.className = "key wide";
  backKey.addEventListener("click", () => handleKey("BACK"));
  keyboardEl.appendChild(backKey);

  // handle physical keyboard
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleKey("ENTER");
    else if (e.key === "Backspace") handleKey("BACK");
    else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
  });

  function handleKey(key) {
    if (currentRow >= maxRows) return;
    const row = board.children[currentRow];
    if (key === "BACK") {
      if (currentCol > 0) {
        currentCol--;
        row.children[currentCol].textContent = "";
      }
    } else if (key === "ENTER") {
      if (currentCol === maxCols) submitGuess();
    } else if (currentCol < maxCols) {
      row.children[currentCol].textContent = key;
      currentCol++;
    }
  }

  async function submitGuess() {
  const row = board.children[currentRow];
  let guess = "";
  for (let i = 0; i < maxCols; i++) guess += row.children[i].textContent;
  guess = guess.toLowerCase(); 

  if (!WORDS.includes(guess)) {
    message.textContent = "Not in word list!";
    return;
  }

  message.textContent = "";

  // Flip animation + coloring
  for (let i = 0; i < maxCols; i++) {
    const cell = row.children[i];
    cell.classList.add("flip");
    cell.addEventListener("animationend", () => {
      cell.classList.remove("flip");
    }, { once: true });

    const letter = cell.textContent.toLowerCase();
    const keyBtn = [...keyboardEl.children].find(k => k.textContent.toUpperCase() === letter.toUpperCase());

    if (letter === targetWord[i]) {
      cell.classList.add("correct");
      keyBtn?.classList.add("correct");
    } else if (targetWord.includes(letter)) {
      cell.classList.add("present");
      if (!keyBtn?.classList.contains("correct")) keyBtn?.classList.add("present");
    } else {
      cell.classList.add("absent");
      if (!keyBtn?.classList.contains("correct") && !keyBtn?.classList.contains("present")) keyBtn?.classList.add("absent");
    }
  }

  if (guess === targetWord) {
  showEndPopup(true);
  return;
}

  currentRow++;
currentCol = 0;

if (currentRow === maxRows) {

}
