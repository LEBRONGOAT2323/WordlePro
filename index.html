<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wordle Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #181818 0%, #080808 45%, #000 100%);
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .back {
      position: fixed;
      top: 18px;
      left: 20px;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
      z-index: 10;
    }

    .back:hover {
      color: white;
      transform: translateX(-3px);
    }

    header {
      text-align: center;
      margin-top: 25px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      letter-spacing: 3px;
      font-weight: 800;
    }

    .subtitle {
      margin: 7px 0 0;
      color: #777;
      font-size: 13px;
      letter-spacing: 1px;
    }

    #loading {
      margin-top: 25px;
      color: #888;
      font-size: 14px;
      text-align: center;
    }

    #game {
      display: none;
      width: 100%;
      max-width: 500px;
      flex-direction: column;
      align-items: center;
    }

    /* =======================
       BOARD
    ======================= */

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      width: min(350px, 90vw);
      aspect-ratio: 5 / 6;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .tile {
      border: 2px solid #333;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 7vw, 32px);
      font-weight: 800;
      text-transform: uppercase;
      transition:
        transform 0.15s,
        background 0.15s,
        border-color 0.15s;
    }

    .tile.filled {
      border-color: #555;
    }

    .tile.correct {
      background: #538d4e;
      border-color: #538d4e;
    }

    .tile.present {
      background: #b59f3b;
      border-color: #b59f3b;
    }

    .tile.absent {
      background: #3a3a3c;
      border-color: #3a3a3c;
    }

    .tile.pop {
      animation: pop 0.1s ease-out;
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    .tile.flip {
      animation: flip 0.55s ease;
    }

    @keyframes flip {
      0% {
        transform: rotateX(0);
      }

      50% {
        transform: rotateX(90deg);
      }

      100% {
        transform: rotateX(0);
      }
    }

    /* =======================
       MESSAGE
    ======================= */

    #message {
      min-height: 25px;
      margin: 14px 0 8px;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
    }

    /* =======================
       KEYBOARD
    ======================= */

    #keyboard {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .key {
      border: none;
      border-radius: 4px;
      background: #818384;
      color: white;
      min-width: 28px;
      height: 54px;
      padding: 0 7px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition:
        transform 0.08s,
        background 0.15s;
    }

    .key:hover {
      filter: brightness(1.1);
    }

    .key:active {
      transform: scale(0.92);
    }

    .key.wide {
      min-width: 52px;
      font-size: 11px;
    }

    .key.correct {
      background: #538d4e;
    }

    .key.present {
      background: #b59f3b;
    }

    .key.absent {
      background: #3a3a3c;
    }

    /* =======================
       RESULT MODAL
    ======================= */

    #result {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .result-box {
      width: min(380px, 92vw);
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 28px 22px;
      text-align: center;
      box-shadow:
        0 0 30px rgba(0, 255, 221, 0.08);
    }

    .result-box h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .result-word {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 4px;
      margin: 15px 0;
    }

    .result-stats {
      color: #999;
      font-size: 13px;
    }

    .close-button {
      margin-top: 20px;
      padding: 10px 18px;
      border: 1px solid #333;
      border-radius: 7px;
      background: #1b1b1b;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .close-button:hover {
      background: #252525;
    }

    /* =======================
       CREDITS
    ======================= */

    #credits-btn {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      opacity: 0.6;
      cursor: pointer;
      user-select: none;
    }

    #credits-btn:hover {
      opacity: 1;
    }

    #credits-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #credits-popup {
      background: #111;
      border: 1px solid #333;
      padding: 20px 30px;
      text-align: center;
      border-radius: 8px;
    }

    #credits-popup h2 {
      margin-top: 0;
    }

    #credits-popup a {
      color: #6aaa64;
      text-decoration: none;
    }

    #credits-popup a:hover {
      text-decoration: underline;
    }

    @media (max-width: 430px) {

      body {
        padding: 14px;
      }

      .back {
        top: 12px;
        left: 13px;
      }

      header {
        margin-top: 35px;
      }

      .key {
        height: 48px;
        min-width: 25px;
        padding: 0 5px;
      }

      .key.wide {
        min-width: 45px;
      }
    }
  </style>

</head>

  <script>

    // ============================================================
    // WORD LIST SOURCES
    // ============================================================

    const WORD_URLS = [
      "https://darkermango.github.io/5-Letter-words/words.json",
      "https://cdn.jsdelivr.net/gh/darkermango/5-Letter-words@main/words.json",
      "https://raw.githubusercontent.com/darkermango/5-Letter-words/main/words.json"
    ];


    // ============================================================
    // GAME VARIABLES
    // ============================================================

    let WORDS = [];
    let answer = "";
    let guesses = [];
    let currentGuess = "";
    let currentRow = 0;
    let gameOver = false;
    let keyboardState = {};
    let gameReady = false;


    // ============================================================
    // ELEMENTS
    // ============================================================

    const loading =
      document.getElementById("loading");

    const game =
      document.getElementById("game");

    const board =
      document.getElementById("board");

    const message =
      document.getElementById("message");

    const result =
      document.getElementById("result");

    const resultTitle =
      document.getElementById("result-title");

    const resultWord =
      document.getElementById("result-word");

    const resultStats =
      document.getElementById("result-stats");

    const closeResult =
      document.getElementById("close-result");


    // ============================================================
    // STORAGE KEY
    // ============================================================

    const STORAGE_KEY = "wordle-pro-game";


    // ============================================================
    // LOAD SAVED GAME
    //
    // IMPORTANT:
    // If the previous game was completed, delete it.
    // This means refreshing after solving starts a new word.
    //
    // If the player is still in the middle of the game,
    // everything is restored exactly as it was.
    // ============================================================

    function loadGame() {

      try {

        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return false;
        }

        const data =
          JSON.parse(saved);


        // --------------------------------------------------------
        // COMPLETED GAME:
        // Clear it so refresh creates a brand-new word.
        // --------------------------------------------------------

        if (data.gameOver === true) {

          localStorage.removeItem(
            STORAGE_KEY
          );

          return false;
        }


        // --------------------------------------------------------
        // RESTORE ACTIVE GAME
        // --------------------------------------------------------

        if (
          typeof data.answer === "string" &&
          /^[A-Z]{5}$/.test(data.answer)
        ) {

          answer =
            data.answer;

        } else {

          return false;
        }


        guesses =
          Array.isArray(data.guesses)
            ? data.guesses
            : [];

        currentGuess =
          typeof data.currentGuess === "string"
            ? data.currentGuess
            : "";

        currentRow =
          Number.isInteger(data.currentRow)
            ? data.currentRow
            : guesses.length;

        gameOver = false;

        keyboardState =
          data.keyboardState || {};

        return true;

      } catch (error) {

        console.warn(
          "Could not restore saved game:",
          error
        );

        localStorage.removeItem(
          STORAGE_KEY
        );

        return false;
      }
    }


    // ============================================================
    // SAVE GAME
    // ============================================================

    function saveGame() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            answer,
            guesses,
            currentGuess,
            currentRow,
            gameOver,
            keyboardState
          })
        );

      } catch (error) {

        console.warn(
          "Could not save game:",
          error
        );
      }
    }


    // ============================================================
    // CREATE NEW WORD
    // ============================================================

    function createNewWord() {

      const randomIndex =
        Math.floor(
          Math.random() * WORDS.length
        );

      answer =
        WORDS[randomIndex];

      guesses = [];
      currentGuess = "";
      currentRow = 0;
      gameOver = false;
      keyboardState = {};

      saveGame();
    }


    // ============================================================
    // CREATE BOARD
    // ============================================================

    function createBoard() {

      board.innerHTML = "";

      for (
        let row = 0;
        row < 6;
        row++
      ) {

        const rowElement =
          document.createElement("div");

        rowElement.className =
          "row";

        for (
          let col = 0;
          col < 5;
          col++
        ) {

          const tile =
            document.createElement("div");

          tile.className =
            "tile";

          tile.dataset.row =
            row;

          tile.dataset.col =
            col;

          rowElement.appendChild(
            tile
          );
        }

        board.appendChild(
          rowElement
        );
      }
    }


    // ============================================================
    // UPDATE BOARD
    // ============================================================

    function updateBoard() {

      const tiles =
        document.querySelectorAll(
          ".tile"
        );

      tiles.forEach(tile => {

        const row =
          Number(tile.dataset.row);

        const col =
          Number(tile.dataset.col);

        tile.className =
          "tile";

        let letter = "";


        if (
          row < guesses.length
        ) {

          letter =
            guesses[row][col] || "";

        } else if (
          row === currentRow
        ) {

          letter =
            currentGuess[col] || "";
        }


        tile.textContent =
          letter;

        if (letter) {

          tile.classList.add(
            "filled"
          );
        }

      });


      // Restore completed guesses

      guesses.forEach(
        (guess, row) => {

          const states =
            getGuessResult(guess);

          states.forEach(
            (state, col) => {

              const tile =
                document.querySelector(
                  `.tile[data-row="${row}"][data-col="${col}"]`
                );

              if (tile) {

                tile.classList.add(
                  state
                );
              }

            }
          );

        }
      );


      updateKeyboard();
    }


    // ============================================================
    // CHECK GUESS
    // ============================================================

    function getGuessResult(guess) {

      const states =
        Array(5).fill("absent");

      const answerLetters =
        answer.split("");

      const guessLetters =
        guess.split("");


      // Correct letters

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        if (
          guessLetters[i] ===
          answerLetters[i]
        ) {

          states[i] =
            "correct";

          answerLetters[i] =
            null;

          guessLetters[i] =
            null;
        }

      }


      // Present letters

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        if (
          !guessLetters[i]
        ) {

          continue;
        }

        const index =
          answerLetters.indexOf(
            guessLetters[i]
          );

        if (index !== -1) {

          states[i] =
            "present";

          answerLetters[index] =
            null;
        }

      }

      return states;
    }


    // ============================================================
    // ADD LETTER
    // ============================================================

    function addLetter(letter) {

      if (
        !gameReady ||
        gameOver ||
        currentGuess.length >= 5
      ) {

        return;
      }

      currentGuess +=
        letter.toUpperCase();

      updateBoard();

      saveGame();
    }


    // ============================================================
    // DELETE LETTER
    // ============================================================

    function deleteLetter() {

      if (
        !gameReady ||
        gameOver ||
        currentGuess.length === 0
      ) {

        return;
      }

      currentGuess =
        currentGuess.slice(
          0,
          -1
        );

      updateBoard();

      saveGame();
    }


    // ============================================================
    // SUBMIT GUESS
    // ============================================================

    function submitGuess() {

      if (
        !gameReady ||
        gameOver
      ) {

        return;
      }


      if (
        currentGuess.length !== 5
      ) {

        showMessage(
          "Not enough letters."
        );

        return;
      }


      if (
        !WORDS.includes(
          currentGuess
        )
      ) {

        showMessage(
          "Not in word list."
        );

        return;
      }


      const submitted =
        currentGuess;

      guesses.push(
        submitted
      );

      currentGuess = "";


      // Update keyboard

      const states =
        getGuessResult(
          submitted
        );

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        updateKeyboardState(
          submitted[i],
          states[i]
        );
      }


      updateBoard();


      // Animation

      animateRow(
        currentRow
      );


      // WIN

      if (
        submitted === answer
      ) {

        const attempts =
          currentRow + 1;

        currentRow++;

        gameOver = true;

        saveGame();


        setTimeout(() => {

          showResult(
            true,
            attempts
          );

        }, 1300);

        return;
      }


      currentRow++;


      // LOSS

      if (
        currentRow >= 6
      ) {

        gameOver = true;

        saveGame();


        setTimeout(() => {

          showResult(
            false,
            6
          );

        }, 1300);

        return;
      }


      saveGame();
    }


    // ============================================================
    // ROW ANIMATION
    // ============================================================

    function animateRow(row) {

      const tiles =
        document.querySelectorAll(
          `.tile[data-row="${row}"]`
        );

      tiles.forEach(
        (tile, index) => {

          setTimeout(() => {

            tile.classList.add(
              "flip"
            );

          }, index * 100);

        }
      );
    }


    // ============================================================
    // KEYBOARD STATE
    // ============================================================

    function updateKeyboardState(
      letter,
      state
    ) {

      const priority = {
        absent: 1,
        present: 2,
        correct: 3
      };

      const oldState =
        keyboardState[letter];

      if (
        !oldState ||
        priority[state] >
        priority[oldState]
      ) {

        keyboardState[letter] =
          state;
      }
    }


    // ============================================================
    // UPDATE KEYBOARD
    // ============================================================

    function updateKeyboard() {

      document
        .querySelectorAll(".key")
        .forEach(key => {

          const letter =
            key.dataset.key;

          key.classList.remove(
            "correct",
            "present",
            "absent"
          );

          if (
            keyboardState[letter]
          ) {

            key.classList.add(
              keyboardState[letter]
            );
          }

        });
    }


    // ============================================================
    // MESSAGE
    // ============================================================

    let messageTimer;

    function showMessage(text) {

      clearTimeout(
        messageTimer
      );

      message.textContent =
        text;

      messageTimer =
        setTimeout(() => {

          if (!gameOver) {

            message.textContent =
              "";
          }

        }, 1800);
    }


    // ============================================================
    // RESULT
    // ============================================================

    function showResult(
      won,
      attempts
    ) {

      resultTitle.textContent =
        won
          ? "You got it!"
          : "Better luck next time!";

      resultWord.textContent =
        answer;


      if (won) {

        resultStats.textContent =
          `Solved in ${attempts} ${
            attempts === 1
              ? "guess"
              : "guesses"
          }.`;

      } else {

        resultStats.textContent =
          "The word was revealed.";
      }


      result.style.display =
        "flex";
    }


    // ============================================================
    // CLOSE RESULT
    // ============================================================

    closeResult.addEventListener(
      "click",
      () => {

        result.style.display =
          "none";

      }
    );


    // ============================================================
    // PHYSICAL KEYBOARD
    // ============================================================

    document.addEventListener(
      "keydown",
      event => {

        if (!gameReady) {
          return;
        }

        const key =
          event.key.toUpperCase();


        if (
          key.length === 1 &&
          /^[A-Z]$/.test(key)
        ) {

          addLetter(key);

          return;
        }


        if (
          event.key ===
          "Backspace"
        ) {

          deleteLetter();

          return;
        }


        if (
          event.key ===
          "Enter"
        ) {

          submitGuess();
        }

      }
    );


    // ============================================================
    // ON-SCREEN KEYBOARD
    // ============================================================

    document
      .querySelectorAll(".key")
      .forEach(key => {

        key.addEventListener(
          "click",
          () => {

            const value =
              key.dataset.key;


            if (
              value === "ENTER"
            ) {

              submitGuess();

            } else if (
              value === "BACKSPACE"
            ) {

              deleteLetter();

            } else {

              addLetter(value);

            }

          }
        );

      });


    // ============================================================
    // LOAD WORD LIST
    // ============================================================

    async function loadWords() {

      let lastError = null;

      for (
        const url of WORD_URLS
      ) {

        try {

          console.log(
            "Trying word list:",
            url
          );


          const response =
            await fetch(url, {
              method: "GET",
              cache: "no-store"
            });


          if (!response.ok) {

            throw new Error(
              `HTTP ${response.status}`
            );
          }


          const data =
            await response.json();


          let rawWords;


          if (
            Array.isArray(data)
          ) {

            rawWords =
              data;

          } else if (
            data &&
            Array.isArray(data.words)
          ) {

            rawWords =
              data.words;

          } else {

            throw new Error(
              "Unexpected word-list format"
            );
          }


          // Clean words

          const cleaned =
            rawWords
              .map(word =>
                String(word)
                  .trim()
                  .toUpperCase()
              )
              .filter(word =>
                /^[A-Z]{5}$/.test(word)
              );


          if (
            cleaned.length < 100
          ) {

            throw new Error(
              "Word list contains too few valid words"
            );
          }


          // Remove duplicates

          WORDS =
            [...new Set(cleaned)];


          console.log(
            `Loaded ${WORDS.length} five-letter words.`
          );


          return;

        } catch (error) {

          console.warn(
            `Failed to load ${url}:`,
            error
          );

          lastError =
            error;
        }

      }


      throw lastError ||
        new Error(
          "All word-list sources failed."
        );
    }


    // ============================================================
    // START GAME
    // ============================================================

    async function startGame() {

      try {

        await loadWords();


        // --------------------------------------------------------
        // Try to restore an unfinished game.
        //
        // If no unfinished game exists, a completely new
        // random word is created.
        // --------------------------------------------------------

        const restored =
          loadGame();


        if (!restored) {

          createNewWord();
        }


        // Create board

        createBoard();


        // Restore board

        updateBoard();


        // Show game

        loading.style.display =
          "none";

        game.style.display =
          "flex";

        gameReady = true;


        if (guesses.length > 0) {

          message.textContent =
            "Game restored.";

          setTimeout(() => {

            if (!gameOver) {

              message.textContent =
                "";
            }

          }, 1200);
        }

      } catch (error) {

        console.error(
          "WORDLE WORD LIST ERROR:",
          error
        );

        loading.textContent =
          "Could not load word list.";

        loading.style.color =
          "#777";
      }
    }


    // ============================================================
    // CREDITS
    // ============================================================

    const creditsBtn =
      document.getElementById(
        "credits-btn"
      );

    const creditsOverlay =
      document.getElementById(
        "credits-overlay"
      );


    creditsBtn.addEventListener(
      "click",
      () => {

        creditsOverlay.style.display =
          "flex";

      }
    );


    creditsOverlay.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          creditsOverlay
        ) {

          creditsOverlay.style.display =
            "none";
        }

      }
    );


    // ============================================================
    // START
    // ============================================================

    startGame();

  </script>
